name: Publish CodePhantom v1 APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-codephantom-v1-apk.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify signed production artifact
        env:
          ARTIFACT_URL: "https://sdmntprcentralindia.oaiusercontent.com/files/00000000-e2b4-8208-9e92-d51818fc8999/raw?se=2026-10-01T15%3A44%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=1da35470-3be6-5452-a0f6-9accc1ff56e6&skoid=3cb6de21-012a-49c9-9402-a1ebf8d0bd06&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T11%3A35%3A31Z&ske=2026-10-02T11%3A35%3A31Z&sks=b&skv=2026-02-06&sig=fVilqhScYENjkNIfatJvtk2gJI50bq3UEMJacYG89qM%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          apk="$(find artifact -type f -name app-release.apk | head -n 1)"
          sums="$(find artifact -type f -name SHA256SUMS.txt | head -n 1)"
          test -n "$apk"
          test -n "$sums"
          expected="$(grep 'app-release.apk$' "$sums" | awk '{print $1}')"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          test "$actual" = "$expected"
          test "$actual" = "d978609518eaf5e0a92dcc5c4c13ca47131014f13a35e64a15afc9dd26d4c1f7"
          cp "$apk" CodePhantom-v1.0.0-build3.apk
          cp "$sums" CodePhantom-v1.0.0-build3-SHA256SUMS.txt

      - name: Publish official website release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view codephantom-v1.0.0 >/dev/null 2>&1; then
            gh release create codephantom-v1.0.0 \
              --target "${GITHUB_SHA}" \
              --title "CodePhantom v1.0.0 Build 3" \
              --notes "Family/beta release of the signed CodePhantom Android app. Download only from the official CodePhantom website or this release asset."
          fi
          gh release upload codephantom-v1.0.0 \
            CodePhantom-v1.0.0-build3.apk \
            CodePhantom-v1.0.0-build3-SHA256SUMS.txt \
            --clobber
